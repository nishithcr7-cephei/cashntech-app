# =============================================================================
# CashnTech – iOS CI/CD (Codemagic)
# =============================================================================
# IMPORTANT: Codemagic dashboard → use "codemagic.yaml" as config source.
# Do NOT use the old UI workflow (CashNTech.xcworkspace / scheme CashNTech).
# Correct paths: ios/CashnTech SCF.xcworkspace + scheme "CashnTech SCF"
#
# Release build: iPhone only (TARGETED_DEVICE_FAMILY=1), portrait only – see Info.plist.
# Run workflow: ios-testflight-distribution
#
# All API/env values are below – DevGroup is NOT required.
# =============================================================================

definitions:
  ios_env: &ios_env
    node: 20
    xcode: 16.2
    cocoapods: default
    vars:
      API_URL: https://losapidev.cashntech.com
      FILE_DOWNLOAD_URL: https://d2wayd1he5a7q1.cloudfront.net
      RK_ENCRYPTION_KEY: "u/Gu5posvwDsXUnV5Zaq4g=="
      RK_ENCRYPTION_IV: "5D9r9ZVzEYYgha93/aUK2w=="
      BUNDLE_ID: com.lms.cashntech
      XCODE_WORKSPACE: "ios/CashnTech SCF.xcworkspace"
      XCODE_SCHEME: "CashnTech SCF"
      XCODE_PROJECT: "ios/CashNTech.xcodeproj"
      DERIVED_DATA_PATH: $CM_BUILD_DIR/ios_derived
      APPETIZE_ZIP_NAME: CashNTech-appetize-simulator
      # iPhone only – do not build for iPad (TARGETED_DEVICE_FAMILY=1 in Xcode project)
      TARGETED_DEVICE_FAMILY: "1"

  rn_cache: &rn_cache
    cache_paths:
      - $HOME/.npm
      - $HOME/Library/Caches/Yarn
      - $CM_BUILD_DIR/node_modules

  scripts:
    - &write_env_appetize
      name: Write .env for Appetize simulator build
      script: |
        set -euo pipefail
        cat > .env <<EOF
        API_URL=${API_URL}
        FILE_DOWNLOAD_URL=${FILE_DOWNLOAD_URL}
        RK_ENCRYPTION_KEY=${RK_ENCRYPTION_KEY}
        RK_ENCRYPTION_IV=${RK_ENCRYPTION_IV}
        IS_APPETIZE_BUILD=true
        EOF
        sed -i '' 's/^[[:space:]]*//' .env 2>/dev/null || sed -i 's/^[[:space:]]*//' .env
        echo "=== .env (Appetize) ==="
        cat .env

    - &write_env_release
      name: Write production .env for release build
      script: |
        set -euo pipefail
        cat > .env <<EOF
        API_URL=${API_URL}
        FILE_DOWNLOAD_URL=${FILE_DOWNLOAD_URL}
        RK_ENCRYPTION_KEY=${RK_ENCRYPTION_KEY}
        RK_ENCRYPTION_IV=${RK_ENCRYPTION_IV}
        EOF
        sed -i '' 's/^[[:space:]]*//' .env 2>/dev/null || sed -i 's/^[[:space:]]*//' .env
        echo "=== .env (Release / iPhone) ==="
        cat .env

    - &verify_iphone_portrait
      name: Verify iPhone-only portrait configuration
      script: |
        set -euo pipefail
        echo "=== Info.plist orientations ==="
        /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" ios/CashNTech/Info.plist
        if /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" ios/CashNTech/Info.plist 2>/dev/null; then
          echo "ERROR: iPad orientations must not be defined (iPhone-only app)"
          exit 1
        fi
        if grep -q UIInterfaceOrientationLandscape ios/CashNTech/Info.plist; then
          echo "ERROR: Landscape orientation found in Info.plist"
          exit 1
        fi
        if ! grep -q 'TARGETED_DEVICE_FAMILY = 1' ios/CashNTech.xcodeproj/project.pbxproj; then
          echo "ERROR: TARGETED_DEVICE_FAMILY must be 1 (iPhone only)"
          exit 1
        fi
        echo "OK: iPhone-only, portrait-only verified"

    - &install_js_dependencies
      name: Install JavaScript dependencies
      script: |
        set -e
        yarn install --frozen-lockfile --production=false

    - &install_pods_appetize
      name: Install CocoaPods (simulator – ML Kit excluded, Old Architecture)
      script: |
        set -e
        export APPETIZE_BUILD=true
        export RCT_NEW_ARCH_ENABLED=0
        cd ios
        rm -rf Pods Podfile.lock build
        printf '%s\n' '{"newArchEnabled":"false"}' > Podfile.properties.json
        echo "=== Podfile.properties.json ==="
        cat Podfile.properties.json
        pod install
        echo "=== Pod install done (APPETIZE_BUILD=true, New Arch off) ==="

    - &bundle_js_ios
      name: Bundle JavaScript for iOS (no Metro)
      script: |
        set -euo pipefail

        # Match native Appetize build (New Architecture off)
        export APPETIZE_BUILD=true
        export RCT_NEW_ARCH_ENABLED=0

        JS_BUNDLE_DIR="${CM_BUILD_DIR}/jsbundle"
        mkdir -p "${JS_BUNDLE_DIR}/assets"

        echo "=== react-native bundle (RCT_NEW_ARCH_ENABLED=0) ==="
        npx react-native bundle \
          --platform ios \
          --dev false \
          --entry-file index.js \
          --bundle-output "${JS_BUNDLE_DIR}/main.jsbundle.packager" \
          --assets-dest "${JS_BUNDLE_DIR}/assets"

        HERMESC="${CM_BUILD_DIR}/ios/Pods/hermes-engine/destroot/bin/hermesc"
        if [ -x "${HERMESC}" ]; then
          echo "=== hermesc (bytecode) ==="
          "${HERMESC}" -emit-binary -max-diagnostic-width=80 -O \
            -out "${JS_BUNDLE_DIR}/main.jsbundle" \
            "${JS_BUNDLE_DIR}/main.jsbundle.packager"
          rm -f "${JS_BUNDLE_DIR}/main.jsbundle.packager"
        else
          mv "${JS_BUNDLE_DIR}/main.jsbundle.packager" "${JS_BUNDLE_DIR}/main.jsbundle"
        fi

        ls -la "${JS_BUNDLE_DIR}/"
        test -f "${JS_BUNDLE_DIR}/main.jsbundle"

    - &install_pods
      name: Install CocoaPods dependencies
      script: |
        set -e
        cd ios
        pod install

workflows:
  # ===========================================================================
  # Simulator .app → download zip → manual Appetize upload
  # ===========================================================================
  ios-simulator-appetize:
    name: CashnTech iOS Simulator (Appetize)
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      <<: *ios_env

    cache:
      <<: *rn_cache

    scripts:
      - *install_js_dependencies
      - *write_env_appetize
      - *verify_iphone_portrait
      - *install_pods_appetize
      - *bundle_js_ios

      - name: Build iOS Simulator .app
        script: |
          set -euo pipefail

          JS_BUNDLE_DIR="${CM_BUILD_DIR}/jsbundle"
          ENV_PATH="${CM_BUILD_DIR}/.env"

          # Xcode script phases read ios/.xcode.env.local (not the outer shell env)
          cat > ios/.xcode.env.local <<EOF
          export ENVFILE=${ENV_PATH}
          export SKIP_BUNDLING=1
          export RCT_NEW_ARCH_ENABLED=0
          export APPETIZE_BUILD=true
          EOF
          sed -i '' 's/^[[:space:]]*//' ios/.xcode.env.local 2>/dev/null \
            || sed -i 's/^[[:space:]]*//' ios/.xcode.env.local

          export ENVFILE="${ENV_PATH}"
          export SKIP_BUNDLING=1
          export RCT_NEW_ARCH_ENABLED=0
          export APPETIZE_BUILD=true

          echo "ENVFILE=${ENVFILE}"
          cat ios/.xcode.env.local

          rm -rf "${DERIVED_DATA_PATH}"

          xcodebuild \
            -workspace "${XCODE_WORKSPACE}" \
            -scheme "${XCODE_SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            TARGETED_DEVICE_FAMILY="${TARGETED_DEVICE_FAMILY}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64 \
            ENABLE_DEBUG_DYLIB=NO \
            RCT_NEW_ARCH_ENABLED=NO \
            build 2>&1 | tee "${CM_BUILD_DIR}/xcodebuild.log" || {
              echo "=== xcodebuild failed ==="
              grep -E 'error:|undefined symbol|library not found|ld:|ENVFILE|API_URL' "${CM_BUILD_DIR}/xcodebuild.log" | tail -n 100 \
                || tail -n 100 "${CM_BUILD_DIR}/xcodebuild.log"
              exit 1
            }

          APP_PATH="$(find "${DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: No .app in derived data"
            exit 1
          fi

          echo "=== Embedding pre-built JS bundle into ${APP_PATH} ==="
          cp "${JS_BUNDLE_DIR}/main.jsbundle" "${APP_PATH}/main.jsbundle"
          if [ -d "${JS_BUNDLE_DIR}/assets" ]; then
            cp -R "${JS_BUNDLE_DIR}/assets/." "${APP_PATH}/" || true
          fi

          if [ ! -f "${APP_PATH}/main.jsbundle" ]; then
            echo "ERROR: main.jsbundle still missing after embed"
            exit 1
          fi
          echo "OK: main.jsbundle embedded ($(wc -c < "${APP_PATH}/main.jsbundle") bytes)"

      - name: Package simulator .app as zip
        script: |
          set -euo pipefail
          APP_PATH="$(find "${DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          APP_DIR="$(dirname "${APP_PATH}")"
          APP_NAME="$(basename "${APP_PATH}")"
          ZIP_PATH="${CM_BUILD_DIR}/${APPETIZE_ZIP_NAME}.zip"
          (cd "${APP_DIR}" && zip -r -q "${ZIP_PATH}" "${APP_NAME}")
          echo "Download: ${ZIP_PATH}"

    artifacts:
      - $CM_BUILD_DIR/${APPETIZE_ZIP_NAME}.zip
      - $CM_BUILD_DIR/.env
      - $CM_BUILD_DIR/xcodebuild.log
      - $DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/**/*.app

  # ===========================================================================
  # Release .ipa → TestFlight
  # ===========================================================================
  ios-testflight-distribution:
    name: iOS TestFlight Distribution
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      <<: *ios_env
      groups:
        - IOS_Credentials

    cache:
      <<: *rn_cache
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/Yarn
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - *install_js_dependencies
      - *write_env_release
      - *verify_iphone_portrait
      - *install_pods

      - name: Set up iOS code signing
        script: |
          set -euo pipefail
          : "${CM_CERTIFICATE:?CM_CERTIFICATE missing in IOS_Credentials}"
          : "${CM_CERTIFICATE_PASSWORD:?CM_CERTIFICATE_PASSWORD missing in IOS_Credentials}"
          : "${CM_PROVISIONING_PROFILE:?CM_PROVISIONING_PROFILE missing in IOS_Credentials}"

          keychain initialize
          echo "${CM_CERTIFICATE}" | base64 --decode > "${CM_BUILD_DIR}/distribution.p12"
          echo "${CM_PROVISIONING_PROFILE}" | base64 --decode > "${CM_BUILD_DIR}/profile.mobileprovision"

          keychain add-certificates \
            --certificate "${CM_BUILD_DIR}/distribution.p12" \
            --certificate-password "${CM_CERTIFICATE_PASSWORD}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(
            grep -aA1 UUID "${CM_BUILD_DIR}/profile.mobileprovision" \
              | grep -io '[-A-F0-9]\{36\}' | head -n 1
          )"
          cp "${CM_BUILD_DIR}/profile.mobileprovision" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          xcode-project use-profiles \
            --project "${XCODE_PROJECT}" \
            --profile "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build release .ipa (iPhone device, portrait only)
        script: |
          set -euo pipefail
          export ENVFILE="${CM_BUILD_DIR}/.env"
          # iphoneos release – TARGETED_DEVICE_FAMILY=1 and portrait set in Xcode project
          xcode-project build-ipa \
            --workspace "${XCODE_WORKSPACE}" \
            --scheme "${XCODE_SCHEME}" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
