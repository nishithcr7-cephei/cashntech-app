# =============================================================================
# CashnTech SCF – React Native iOS CI/CD (Codemagic)
# =============================================================================
# Required Codemagic environment groups (configure in dashboard UI):
#   • IOS_Credentials  – CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD,
#                        CM_PROVISIONING_PROFILE, APP_STORE_CONNECT_KEY_IDENTIFIER,
#                        APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
#   • Dev Group        – optional override for API_URL, FILE_DOWNLOAD_URL, etc.
#                        (defaults are set in ios_env vars below)
#
# Additional secrets (Codemagic dashboard or workflow env):
#   • TEST_USERNAME    – Simulator auto-login username (optional)
#   • TEST_PASSWORD    – Simulator auto-login password (optional)
#
# =============================================================================

definitions:
  ios_env: &ios_env
    node: 20
    xcode: 16.2
    cocoapods: default
    vars:
      BUNDLE_ID: com.lms.cashntech
      XCODE_WORKSPACE: "ios/CashnTech SCF.xcworkspace"
      XCODE_SCHEME: "CashnTech SCF"
      XCODE_PROJECT: "ios/CashNTech.xcodeproj"
      DERIVED_DATA_PATH: $CM_BUILD_DIR/ios_derived
      API_URL: https://losapidev.cashntech.com
      FILE_DOWNLOAD_URL: https://d2wayd1he5a7q1.cloudfront.net
      RK_ENCRYPTION_KEY: "u/Gu5posvwDsXUnV5Zaq4g=="
      RK_ENCRYPTION_IV: "5D9r9ZVzEYYgha93/aUK2w=="

  rn_cache: &rn_cache
    cache_paths:
      - $HOME/.npm
      - $HOME/Library/Caches/Yarn
      - $CM_BUILD_DIR/node_modules
      - $CM_BUILD_DIR/ios/Pods

  scripts:
    - &install_js_dependencies
      name: Install JavaScript dependencies
      script: |
        set -e
        # Install devDependencies too (required for @react-native-community/cli-platform-ios autolinking)
        yarn install --frozen-lockfile --production=false

    - &install_pods
      name: Install CocoaPods dependencies
      script: |
        set -e
        cd ios
        pod install

workflows:
  # ===========================================================================
  # Workflow 1: Simulator .app build (Debug / iphonesimulator) – manual Appetize upload
  # ===========================================================================
  ios-appetize-testing:
    name: iOS Simulator Build
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      <<: *ios_env

    cache:
      <<: *rn_cache

    scripts:
      - *install_js_dependencies

      # ML Kit has no arm64-simulator binaries – exclude before pod install (see react-native.config.js)
      - name: Install CocoaPods dependencies (Appetize simulator)
        script: |
          set -e
          export APPETIZE_BUILD=true
          cd ios
          rm -rf Pods
          pod install

      # react-native-config reads .env at build time – use standard .env (not .env.prod)
      - name: Generate .env for Appetize simulator build
        script: |
          set -euo pipefail

          cat > .env <<EOF
          API_URL=${API_URL}
          FILE_DOWNLOAD_URL=${FILE_DOWNLOAD_URL}
          RK_ENCRYPTION_KEY=${RK_ENCRYPTION_KEY}
          RK_ENCRYPTION_IV=${RK_ENCRYPTION_IV}
          IS_APPETIZE_BUILD=true
          TEST_USERNAME=${TEST_USERNAME:-your_test_user}
          TEST_PASSWORD=${TEST_PASSWORD:-your_password}
          EOF
          sed -i '' 's/^[[:space:]]*//' .env 2>/dev/null || sed -i 's/^[[:space:]]*//' .env

          echo ".env ready for Appetize:"
          grep -E '^(API_URL|IS_APPETIZE_BUILD|TEST_USERNAME)=' .env || true

      - name: Build iOS Simulator .app
        script: |
          set -euo pipefail

          # mac_mini_m2 is Apple Silicon – build arm64 simulator only (x86_64 fmt pod often fails)
          xcodebuild \
            -workspace "${XCODE_WORKSPACE}" \
            -scheme "${XCODE_SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64 \
            ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee "${CM_BUILD_DIR}/xcodebuild.log" || {
              echo "=== xcodebuild failed – last 80 lines of linker output ==="
              grep -E 'error:|undefined symbol|library not found|ld:' "${CM_BUILD_DIR}/xcodebuild.log" | tail -n 80 || tail -n 80 "${CM_BUILD_DIR}/xcodebuild.log"
              exit 1
            }

      - name: Package simulator .app as zip
        script: |
          set -euo pipefail

          APP_PATH="$(find "${DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: No .app found in ${DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator"
            exit 1
          fi

          APP_DIR="$(dirname "${APP_PATH}")"
          APP_NAME="$(basename "${APP_PATH}")"
          ZIP_PATH="${CM_BUILD_DIR}/simulator-app.zip"

          (cd "${APP_DIR}" && zip -r -q "${ZIP_PATH}" "${APP_NAME}")
          echo "Packaged ${APP_NAME} → ${ZIP_PATH} (upload to Appetize manually)"

    artifacts:
      - $CM_BUILD_DIR/simulator-app.zip
      - $CM_BUILD_DIR/xcodebuild.log
      - $DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/**/*.app

  # ===========================================================================
  # Workflow 2: Release .ipa → TestFlight (Release / iphoneos)
  # ===========================================================================
  ios-testflight-distribution:
    name: iOS TestFlight Distribution
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      <<: *ios_env
      groups:
        - IOS_Credentials

    cache:
      <<: *rn_cache

    scripts:
      - *install_js_dependencies
      - *install_pods

      # Copy .env.prod → .env so react-native-config picks up production values
      - name: Prepare production .env from .env.prod
        script: |
          set -euo pipefail

          if [ -f ".env.prod" ]; then
            echo "Copying .env.prod → .env"
            cp .env.prod .env
          else
            echo "Creating .env from codemagic.yaml vars"
            : > .env
          fi

          upsert_env() {
            local key="$1" value="$2"
            if grep -q "^${key}=" .env 2>/dev/null; then
              sed -i '' "s|^${key}=.*|${key}=${value}|" .env 2>/dev/null \
                || sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          upsert_env API_URL "${API_URL}"
          upsert_env FILE_DOWNLOAD_URL "${FILE_DOWNLOAD_URL}"
          upsert_env RK_ENCRYPTION_KEY "${RK_ENCRYPTION_KEY}"
          upsert_env RK_ENCRYPTION_IV "${RK_ENCRYPTION_IV}"

          echo "Production .env ready:"
          grep -E '^(API_URL|FILE_DOWNLOAD_URL)=' .env || true

      # Decode IOS_Credentials and bind profile to com.lms.cashntech
      - name: Set up iOS code signing
        script: |
          set -euo pipefail

          : "${CM_CERTIFICATE:?CM_CERTIFICATE missing in IOS_Credentials}"
          : "${CM_CERTIFICATE_PASSWORD:?CM_CERTIFICATE_PASSWORD missing in IOS_Credentials}"
          : "${CM_PROVISIONING_PROFILE:?CM_PROVISIONING_PROFILE missing in IOS_Credentials}"

          keychain initialize

          echo "${CM_CERTIFICATE}" | base64 --decode > "${CM_BUILD_DIR}/distribution.p12"
          echo "${CM_PROVISIONING_PROFILE}" | base64 --decode > "${CM_BUILD_DIR}/profile.mobileprovision"

          keychain add-certificates \
            --certificate "${CM_BUILD_DIR}/distribution.p12" \
            --certificate-password "${CM_CERTIFICATE_PASSWORD}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(
            grep -aA1 UUID "${CM_BUILD_DIR}/profile.mobileprovision" \
              | grep -io '[-A-F0-9]\{36\}' | head -n 1
          )"
          cp "${CM_BUILD_DIR}/profile.mobileprovision" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          xcode-project use-profiles \
            --project "${XCODE_PROJECT}" \
            --profile "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "Signing ready for bundle ID ${BUNDLE_ID}"

      - name: Build release .ipa
        script: |
          set -euo pipefail

          xcode-project build-ipa \
            --workspace "${XCODE_WORKSPACE}" \
            --scheme "${XCODE_SCHEME}" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
